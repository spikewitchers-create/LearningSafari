<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearningSafari</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-layout">

  <!-- Zijnavigatie -->
  <nav class="zijnav">
    <div class="zijnav-logo">
      <span class="logo-icoon">🦁</span>
      <span class="zijnav-appnaam">Safari</span>
    </div>
    <ul class="zijnav-lijst">
      <li>
        <button class="nav-knop" id="nav-oefenen" data-doel="oefenen">
          <span class="nav-icoon">📚</span>
          <span class="nav-label">Oefenen</span>
        </button>
      </li>
      <li>
        <button class="nav-knop" id="nav-voortgang">
          <span class="nav-icoon">📊</span>
          <span class="nav-label">Voortgang</span>
        </button>
      </li>
      <li>
        <button class="nav-knop nav-uitgeschakeld" title="Komt binnenkort">
          <span class="nav-icoon">⚙️</span>
          <span class="nav-label">Instellingen</span>
        </button>
      </li>
    </ul>
    <div class="zijnav-naam" id="nav-naam"></div>
  </nav>

  <!-- Hoofdinhoud -->
  <div class="hoofd">

    <!-- Titelbalk -->
    <header class="titelbalk">
      <h1 id="scherm-titel" class="scherm-titel"></h1>
    </header>

    <!-- Schermen -->
    <main class="pagina">

      <!-- 1. Welkomstscherm -->
      <section id="scherm-welkom" class="scherm" hidden>
        <div class="kaart">
          <div class="formulier">
            <label for="naam-input">Hoe heet jij?</label>
            <input id="naam-input" type="text" placeholder="Jouw naam"
                   autocomplete="off" maxlength="30">
          </div>
          <button id="welkom-verder-knop" class="knop-groot">Verder →</button>
        </div>
      </section>

      <!-- 2. Keuze-scherm -->
      <section id="scherm-keuze" class="scherm" hidden>
        <div class="kaart">
          <p class="keuze-vraag">Kies je oefenstof</p>

          <p class="keuze-groep-titel">Tafels & deling</p>
          <div class="keuze-optie">
            <label class="optie-label" for="cb-tafels">
              <input type="checkbox" id="cb-tafels">
              <span class="optie-naam">Tafels</span>
              <span id="tafels-voortgang" class="optie-voortgang"></span>
            </label>
            <div id="tafels-sub" class="tafels-sub" hidden>
              <ul id="tafel-lijst" class="tafel-grid"></ul>
              <div class="keuze-acties">
                <button id="alles-knop" class="knop-klein">Alles</button>
                <button id="niets-knop" class="knop-klein">Niets</button>
              </div>
            </div>
          </div>

          <div class="keuze-optie">
            <label class="optie-label" for="cb-deelsommen">
              <input type="checkbox" id="cb-deelsommen">
              <span class="optie-naam">Deelsommen</span>
              <span id="deelsom-voortgang" class="optie-voortgang"></span>
            </label>
          </div>

          <p class="keuze-groep-titel">Optellen, aftrekken & vermenigvuldigen</p>
          <div class="keuze-optie">
            <label class="optie-label" for="cb-optaft">
              <input type="checkbox" id="cb-optaft">
              <span class="optie-naam">Optellen & aftrekken t/m 1000</span>
              <span id="optaft-voortgang" class="optie-voortgang"></span>
            </label>
          </div>

          <div class="keuze-optie">
            <label class="optie-label" for="cb-vermenigv">
              <input type="checkbox" id="cb-vermenigv">
              <span class="optie-naam">Vermenigvuldigen (splitsen &amp; te veel)</span>
              <span id="vermenigv-voortgang" class="optie-voortgang"></span>
            </label>
          </div>

          <p class="keuze-groep-titel">Deling & geld</p>
          <div class="keuze-optie">
            <label class="optie-label" for="cb-deelrest">
              <input type="checkbox" id="cb-deelrest">
              <span class="optie-naam">Deelsommen met rest</span>
              <span id="deelrest-voortgang" class="optie-voortgang"></span>
            </label>
          </div>

          <div class="keuze-optie">
            <label class="optie-label" for="cb-deelsplits">
              <input type="checkbox" id="cb-deelsplits">
              <span class="optie-naam">Deelsommen splitsen</span>
              <span id="deelsplits-voortgang" class="optie-voortgang"></span>
            </label>
          </div>

          <div class="keuze-optie">
            <label class="optie-label" for="cb-halverd">
              <input type="checkbox" id="cb-halverd">
              <span class="optie-naam">Halveren & verdubbelen</span>
              <span id="halverd-voortgang" class="optie-voortgang"></span>
            </label>
          </div>

          <div class="keuze-optie">
            <label class="optie-label" for="cb-geld">
              <input type="checkbox" id="cb-geld">
              <span class="optie-naam">Geld (aanvullen & verschil)</span>
              <span id="geld-voortgang" class="optie-voortgang"></span>
            </label>
          </div>

          <p class="keuze-groep-titel">Verhalend oefenen</p>
          <div class="keuze-optie">
            <label class="optie-label" for="cb-verhaal">
              <input type="checkbox" id="cb-verhaal">
              <span class="optie-naam">Verhalende sommen</span>
              <span id="verhaal-voortgang" class="optie-voortgang"></span>
            </label>
          </div>

          <div class="keuze-optie keuze-sessie">
            <label class="optie-label optie-label-rij" for="sessie-lengte">
              <span class="optie-naam">Aantal sommen per sessie</span>
              <select id="sessie-lengte" class="sessie-select">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="15">15</option>
                <option value="20">20</option>
                <option value="30">30</option>
              </select>
            </label>
          </div>

          <div class="keuze-optie keuze-optie-extra">
            <label class="optie-label" for="cb-autolees">
              <input type="checkbox" id="cb-autolees">
              <span class="optie-naam">🔊 Lees sommen voor</span>
            </label>
            <p class="optie-toelichting">Handig bij dyslexie of als het kind nog leest</p>
          </div>
        </div>
        <button id="keuze-start-knop" class="knop-groot">Start oefenen →</button>
      </section>

      <!-- 3. Sessie-scherm -->
      <section id="scherm-sessie" class="scherm" hidden>
        <div class="voortgang-balk-wrap">
          <div class="voortgang-balk"><div id="voortgang-balk-vul"></div></div>
          <span id="voortgang" class="voortgang-label">1 / 10</span>
        </div>
        <div class="kaart vraag-kaart">
          <p id="vraag" class="vraag"></p>
          <button id="lees-knop" class="knop-lees" title="Lees voor" hidden>🔊</button>
        </div>
        <div class="kaart antwoord-kaart">
          <label for="antwoord-input" class="sr-only">Jouw antwoord</label>
          <input id="antwoord-input" type="text" inputmode="numeric"
                 pattern="[0-9]*" placeholder="?" autocomplete="off">
          <button id="controleer-knop" class="knop-groot">OK</button>
        </div>
        <p id="feedback" class="feedback"></p>
        <div id="hint-gebied" class="hint-gebied" hidden>
          <button id="hint-knop" class="knop-hint">Hint →</button>
          <p id="hint-tekst" class="hint-tekst" hidden></p>
        </div>
        <button id="volgende-knop" class="knop-volgende" hidden>Volgende vraag →</button>
      </section>

      <!-- 4. Voortgang-scherm -->
      <section id="scherm-voortgang" class="scherm" hidden>
        <div class="kaart">
          <p id="vg-totaal" class="vg-totaal"></p>
          <div id="vg-onderdelen" class="vg-onderdelen"></div>
        </div>
        <div class="kaart" id="vg-tafels-kaart">
          <p class="vg-sectie-titel">Tafels — beheersing per tafel</p>
          <div id="vg-tafels-grid" class="vg-tafels-grid"></div>
        </div>
      </section>

      <!-- 5. Resultaat-scherm -->
      <section id="scherm-resultaat" class="scherm" hidden>
        <div class="kaart resultaat-kaart">
          <div class="resultaat-top">
            <span id="resultaat-icoon" class="resultaat-icoon">🏆</span>
            <p id="resultaat-boodschap" class="resultaat-boodschap"></p>
          </div>
          <ul id="resultaat-details" class="resultaat-details"></ul>
          <p id="resultaat-totaal" class="resultaat-sub"></p>
        </div>
        <button id="opnieuw-knop" class="knop-groot">Opnieuw kiezen →</button>
      </section>

    </main>
  </div><!-- .hoofd -->
</div><!-- .app-layout -->

<script type="module" src="js/app.js"></script>
</body>
</html>
